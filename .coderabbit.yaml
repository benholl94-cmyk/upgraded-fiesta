reviews:
  # Incremental reviews nur auf expliziten Trigger, nicht auf jeden Push.
  # Verhindert rate-limit durch automatische Bot-Aktivierung bei jedem Commit.
  review_status: false
  auto_review:
    enabled: false
    drafts: false
    base_branches:
      - main

  # Ausgenommen von Review-Pflicht: generierte Artefakte, Log-Dateien, interne Agenten-Zustandsdaten
  path_filters:
    - "!logs/**"
    - "!ui/public/platform-status.json"
    - "!.claude/persona/**"
    - "!.claude/agents/munin.md"

knowledge_base:
  # Lernmodus: CodeRabbit soll Fixes aus vergangenen Reviews in Zukunft
  # direkt als Inline-Suggestions überspringen wenn bereits bekannt.
  learnings:
    scope: auto
