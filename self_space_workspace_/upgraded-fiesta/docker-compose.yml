version: '3.8'
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: heavy
      POSTGRES_PASSWORD: metal
      POSTGRES_DB: heavy_metal
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
  gateway:
    build: .
    depends_on: [postgres, redis]
    environment:
      HM_GATEWAY_BIND: 0.0.0.0:8080
      HM_ZERO_STAKED: "false"
      HM_STORAGE_ROOT: /data/storage
      HM_OWNER_TOKEN: ${HM_OWNER_TOKEN:?set HM_OWNER_TOKEN in your .env before running compose}
    ports: ["8080:8080"]
    volumes:
      - hm_storage:/data/storage
    restart: unless-stopped
    # hm-gateway is a plain TCP server binding to an unprivileged port and
    # doing local-disk I/O only -- it needs no Linux capabilities at all.
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
  ui:
    build: ./ui
    depends_on: [gateway]
    ports: ["3000:80"]
volumes:
  pgdata:
  hm_storage:
