name: visible-monitoring

on:
  push:
    branches: ["main"]
    paths-ignore:
      - "logs/**"
      - "**.md"
  workflow_dispatch:
  schedule:
    - cron: '23 */6 * * *'

permissions:
  contents: write

jobs:
  visible-monitoring:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run repository monitor
        id: monitor
        continue-on-error: true
        run: |
          set +e
          mkdir -p status
          python3 scripts/monitor_platform.py > status/monitoring-stdout.txt 2>&1
          code=$?
          echo "MONITOR_EXIT_CODE=$code" >> "$GITHUB_ENV"
          exit 0

      - name: Run setup verification
        id: setup
        continue-on-error: true
        run: |
          set +e
          bash .codex/setup.sh >> status/monitoring-stdout.txt 2>&1
          code=$?
          echo "SETUP_EXIT_CODE=$code" >> "$GITHUB_ENV"
          exit 0

      - name: Write visible report
        if: always()
        run: python3 scripts/write_visibility_report.py

      - name: Commit visible report
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4 5; do
            git add status/visible-monitoring-report.json status/monitoring-report.json status/monitoring-stdout.txt
            if git diff --cached --quiet; then
              echo "visible monitoring report unchanged"
              break
            fi
            git commit -m "Update visible monitoring report"
            if git push; then
              break
            fi
            echo "push rejected, resetting onto latest ${GITHUB_REF_NAME} and regenerating (attempt ${attempt})"
            git reset --hard HEAD~1
            git fetch origin "${GITHUB_REF_NAME}"
            git reset --hard "origin/${GITHUB_REF_NAME}"
            python3 scripts/monitor_platform.py >> status/monitoring-stdout.txt 2>&1 || true
            python3 scripts/write_visibility_report.py
            sleep $((attempt * 2))
          done

      - name: Fail after report commit if checks failed
        if: always()
        run: |
          if [ "${MONITOR_EXIT_CODE:-999}" != "0" ] || [ "${SETUP_EXIT_CODE:-999}" != "0" ]; then
            exit 1
          fi
