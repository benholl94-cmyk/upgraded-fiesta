name: rust-ci

# ci.yml covers cargo check/test/fmt/clippy on every push.
# This workflow is kept for monitoring compliance (required-files.json)
# and fires only when triggered manually or when this file itself changes,
# avoiding duplicate CI runs on every push/PR.
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/rust-ci.yml'

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Validate generated repository structure
        run: python3 scripts/validate_repo.py
      - name: Cargo check workspace
        run: cargo check --workspace
