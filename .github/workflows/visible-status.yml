name: visible-status

on:
  push:
    branches: ["main"]
    paths-ignore:
      - "logs/**"
      - "**.md"
  workflow_dispatch:
  schedule:
    - cron: '41 */6 * * *'

permissions:
  contents: write

jobs:
  status:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run monitor
        run: python3 scripts/monitor_platform.py
      - name: Write visible status
        if: always()
        run: python3 scripts/write_visible_status.py
      - name: Commit visible status
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4 5; do
            git add status/monitoring-report.json status/visible-status.json
            if git diff --cached --quiet; then
              echo "visible status unchanged"
              break
            fi
            git commit -m "Update visible platform status [skip ci]"
            if git push; then
              break
            fi
            echo "push rejected, resetting onto latest ${GITHUB_REF_NAME} and regenerating (attempt ${attempt})"
            git reset --hard HEAD~1
            git fetch origin "${GITHUB_REF_NAME}"
            git reset --hard "origin/${GITHUB_REF_NAME}"
            python3 scripts/monitor_platform.py || true
            python3 scripts/write_visible_status.py
            sleep $((attempt * 2))
          done
      - name: Upload visible status artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visible-platform-status
          path: |
            status/monitoring-report.json
            status/visible-status.json
          if-no-files-found: error
          retention-days: 14
