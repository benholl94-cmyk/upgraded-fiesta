name: HUGIN-Kern (T1b)

# Beantwortet Subroom-Aufgaben mit einem lokalen Modell auf Repo-Hardware.
# Die Mobilhardware des Operators wird nie angefasst.
#
# ZUVERLAESSIGKEIT: Zwei Caches tragen das. Ohne sie kostet jeder Lauf
# ~4 Minuten Download und ~3 Minuten Build; mit ihnen startet er in Sekunden.
# Der Modell-Cache haengt am SHA256 aus config/model.json — aendert sich die
# Pinnung, faellt der Cache automatisch weg. Kein manuelles Invalidieren.

on:
  workflow_dispatch:
    inputs:
      frage:
        description: "Frage an den HUGIN-Kern"
        required: true
        type: string
      dateien:
        description: "Kontextdateien, kommasepariert (optional)"
        required: false
        type: string
  schedule:
    # Einmal taeglich den Subroom abarbeiten. Off-Minute, damit der Lauf nicht
    # mit tausend anderen zur vollen Stunde startet.
    - cron: "37 4 * * *"

permissions:
  contents: read

concurrency:
  # Zwei Laeufe gleichzeitig wuerden sich um 14 GB Disk streiten.
  group: hugin-kern
  cancel-in-progress: false

jobs:
  antworten:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4

      - name: Pinnung lesen
        id: pin
        run: |
          set -euo pipefail
          python3 scripts/hugin_model.py plan
          {
            echo "sha=$(python3 -c "import json;print(json.load(open('config/model.json'))['upstream']['sha256'])")"
            echo "url=$(python3 -c "import sys;sys.path.insert(0,'scripts');import hugin_model;print(hugin_model.url())")"
          } >> "$GITHUB_OUTPUT"

      - name: llama.cpp aus dem Cache
        id: cache-llama
        uses: actions/cache@v4
        with:
          path: llama.cpp/build/bin
          key: llama-cpp-b4600-ubuntu24

      - name: llama.cpp bauen
        if: steps.cache-llama.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/ggml-org/llama.cpp
          cmake -S llama.cpp -B llama.cpp/build -DCMAKE_BUILD_TYPE=Release -DLLAMA_CURL=OFF
          cmake --build llama.cpp/build --config Release -j"$(nproc)" --target llama-cli

      - name: Modell aus dem Cache
        id: cache-model
        uses: actions/cache@v4
        with:
          path: models
          # Der Hash IST der Schluessel: neue Pinnung -> neuer Cache.
          key: gguf-${{ steps.pin.outputs.sha }}

      - name: Modell holen
        if: steps.cache-model.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p models
          curl -fL --retry 3 --retry-delay 5 -o models/model.gguf "${{ steps.pin.outputs.url }}"

      - name: Modell pruefen
        # Laeuft IMMER, auch bei Cache-Treffer. Ein beschaedigter Cache-Eintrag
        # waere sonst unsichtbar und das Modell antwortete Unsinn.
        run: python3 scripts/hugin_model.py verify models/model.gguf

      - name: Geerdeten Prompt bauen
        id: prompt
        env:
          FRAGE: ${{ inputs.frage }}
          DATEIEN: ${{ inputs.dateien }}
        run: |
          set -euo pipefail
          ARGS=()
          if [ -n "${DATEIEN:-}" ]; then
            IFS=',' read -ra FS <<< "$DATEIEN"
            for f in "${FS[@]}"; do ARGS+=(--file "$(echo "$f" | xargs)"); done
          fi
          FRAGE_TEXT="${FRAGE:-Was ist im Subroom offen und womit sollte begonnen werden?}"
          python3 scripts/hugin_model.py prompt "$FRAGE_TEXT" "${ARGS[@]}" > prompt.txt
          python3 scripts/hugin_model.py grammar > schema.gbnf
          echo "--- Prompt ---"; cat prompt.txt

      - name: Antworten
        run: |
          set -euo pipefail
          ./llama.cpp/build/bin/llama-cli \
            --model models/model.gguf \
            --file prompt.txt \
            --grammar-file schema.gbnf \
            --threads "$(nproc)" --ctx-size 8192 --batch-size 256 \
            --temp 0.2 --n-predict 700 --no-display-prompt --simple-io \
            2> llama.log | tee antwort.json
          echo "--- Tempo ---"; grep -E "tokens per second|eval time" llama.log | tail -3 || true

      - name: Antwort als Artefakt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hugin-kern-antwort
          path: |
            antwort.json
            prompt.txt
            llama.log
          retention-days: 14
