name: HUGIN Pages Deploy

on:
  push:
    branches: ["main"]
    paths:
      - "hugin/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy HUGIN PWA to GitHub Pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload HUGIN artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: hugin/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
