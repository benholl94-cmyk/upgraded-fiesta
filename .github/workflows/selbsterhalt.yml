name: Selbsterhalt

# Das Repo haelt sich selbst instand — auf eigener Infrastruktur, ohne Geld
# und ohne dass jemand etwas tippt.
#
# WARUM DAS NOETIG WAR: es gab vier Zeitplaene (munin-link-hourly,
# platform-monitoring, visible-monitoring, visible-status). Alle vier
# BEOBACHTEN: sie messen, schreiben einen Bericht ins Repo und enden. Keiner
# repariert etwas, keiner ruft Supervisor oder Clarity auf. Beobachtung ohne
# Erhaltung erzeugt nur Dateien, die niemand liest.
#
# KOSTEN: null. Oeffentliches Repository, damit sind Actions-Minuten frei.
# Die Kostensperre in config/budget.json bleibt zu; dieser Lauf ruft keinen
# abrechnungspflichtigen Dienst.
#
# GRENZE: repariert wird nur, was DETERMINISTISCH ist — eine Dateikopie, ein
# Schluessel, den das Projekt selbst ausstellt, ein Hook aus dem Repo. Alles,
# was eine Entscheidung verlangt, wird eskaliert und nie geraten. Ein Automat,
# der raet, ist gefaehrlicher als einer, der stehen bleibt.

on:
  schedule:
    # Alle sechs Stunden, Off-Minute — nicht zur vollen Stunde, wo weltweit
    # alles gleichzeitig startet und der Runner-Zuteilung nachhaengt.
    - cron: "13 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write        # Reparaturen zurueckschreiben
  issues: write          # genau eine Meldung oeffnen/schliessen

concurrency:
  # Zwei Laeufe wuerden sich um denselben Branch streiten.
  group: selbsterhalt
  cancel-in-progress: false

jobs:
  erhalten:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0     # der Supervisor rechnet gegen den Default-Branch

      - name: Rust-Toolchain
        run: rustup toolchain install stable --profile minimal --component rustfmt

      # Ohne diesen Schritt meldete der Lauf als Messergebnis der Testsuite
      # woertlich "No module named pytest" -- und eskalierte das an den Master
      # als etwas, das eine Entscheidung verlangt. Ein Werkzeug, das fehlt,
      # ist keine Aussage ueber den Code. Dieselbe Luecke wie bei zyklus.yml,
      # wo pytest ohne Gateway-Binary lief.
      - name: Python-Werkzeug
        run: python3 -m pip install --quiet pytest

      # Die Identitaet steht VOR dem Lauf, nicht danach. Der Supervisor
      # rechnet die Committer-Mail waehrend des Laufs nach; war sie zu dem
      # Zeitpunkt leer, meldete er "[VIOLATION] git-committer-identity:
      # Committer-Mail ist (leer)" -- ein Verfassungsverstoss, der reine
      # Reihenfolge war. Ein Befund, der von einem echten nicht zu
      # unterscheiden ist, ist schlimmer als gar keiner.
      - name: Git-Identitaet
        run: |
          git config user.name "Claude"
          git config user.email "noreply@anthropic.com"

      - name: Selbsterhalt-Lauf
        id: lauf
        run: python3 scripts/hugin_selfheal.py --apply

      - name: Zustand lesen
        id: zustand
        run: |
          echo "stand=$(python3 scripts/hugin_selfheal.py --status)" >> "$GITHUB_OUTPUT"

      - name: Reparaturen zurueckschreiben
        run: |
          set -euo pipefail
          if git diff --quiet && git diff --cached --quiet; then
            echo "nichts repariert — kein Commit"
            exit 0
          fi
          git add -A
          GIT_AUTHOR_NAME="benholl94-cmyk" \
          GIT_AUTHOR_EMAIL="274793931+benholl94-cmyk@users.noreply.github.com" \
            git commit -m "chore(selbsterhalt): mechanische Reparaturen [skip ci]"
          git push

      - name: Meldung fuehren
        env:
          GH_TOKEN: ${{ github.token }}
          STAND: ${{ steps.zustand.outputs.stand }}
        # Genau EINE Meldung, an einem festen Titel wiedererkannt. Sie wird
        # geschlossen, sobald die Ursache weg ist — eine Meldung, die nach der
        # Loesung stehen bleibt, bringt allen bei, Meldungen zu ignorieren.
        run: |
          set -euo pipefail
          TITEL="Selbsterhalt: was nur der Master entscheiden kann"
          NUMMER=$(gh issue list --state open --search "$TITEL in:title" \
                     --json number --jq '.[0].number // empty')
          if [ "$STAND" = "offen" ]; then
            python3 scripts/hugin_selfheal.py --bericht > meldung.md
            if [ -n "$NUMMER" ]; then
              gh issue comment "$NUMMER" --body-file meldung.md
            else
              gh issue create --title "$TITEL" --body-file meldung.md
            fi
          elif [ -n "$NUMMER" ]; then
            gh issue close "$NUMMER" \
              --comment "Erledigt: der Selbsterhalt-Lauf findet nichts mehr Offenes."
          else
            echo "nichts offen, keine Meldung vorhanden"
          fi

      - name: Bericht als Artefakt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selbsterhalt
          path: status/selbsterhalt.json
          retention-days: 30
