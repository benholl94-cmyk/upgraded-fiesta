name: Branch-Bereinigung

# Loescht die in docs/branch-cleanup-2026-07-27.md geprueften Branches.
#
# Warum als Workflow und nicht per `git push --delete`: aus der Arbeitsumgebung
# heraus ist die Loeschung dreifach gesperrt — der Berechtigungs-Klassifikator
# verweigert `git push --delete`, der Git-Proxy bricht die Verbindung bei einem
# Lösch-Refspec ab, und der API-Proxy antwortet auf
# `DELETE /git/refs/heads/...` mit
# "Write access to this GitHub API path is not permitted through this proxy."
# Ein Workflow laeuft auf GitHub selbst und geht durch keinen dieser Wege.
#
# Die Liste ist ausgeschrieben und nicht berechnet: geloescht wird genau das,
# was im Protokoll geprueft und begruendet wurde. Eine Regel wie "alles was
# gemergt ist" koennte morgen etwas anderes treffen als heute geprueft wurde.

on:
  workflow_dispatch:
    inputs:
      bestaetigung:
        description: 'Zum Loeschen exakt "loeschen" eintragen. Alles andere ergibt einen Probelauf.'
        required: true
        default: 'probelauf'

permissions:
  contents: write

jobs:
  bereinigen:
    name: Geprüfte Branches entfernen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Löschen
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BESTAETIGUNG: ${{ inputs.bestaetigung }}
        run: |
          set -euo pipefail

          # Niemals loeschen. Die ersten beiden stehen auch in
          # PROTECTED_BRANCHES von .claude/skills/repo-steward/scripts/repo_steward.py;
          # diese Liste wiederholt sie, damit der Schutz nicht davon abhaengt,
          # dass jemand die andere Datei liest.
          GESCHUETZT="main __dolt_remote_info__ claude/claud-ai-code-teleport-nx73zr"

          ZU_LOESCHEN="
          __dolt_remote_info__PLATZHALTER
          benholl94-cmyk/change-stack-8-f1e01161/626283e
          claude/env-points-anchors-localization-flyoos
          claude/flow-collision-fix
          claude/handoff-documentation-8qf1v9
          claude/platform-hardening
          claude/repo-completeness-check-3kme9t
          claude/workspace-finalize-nx73zr
          coderabbitai/docstrings/734540e
          coderabbitai/docstrings/ec87f08
          coderabbitai/utg/3eb370c
          coderabbitai/utg/4cb740b
          coderabbitai/utg/c38a454
          codespace-codeagent-mobile-97pvvqgp594527776
          codex/build-self-made-github-app
          codex/richte-lokale-entwicklerumgebung-auf-iphone-ein
          codex/richte-lokale-entwicklerumgebung-auf-iphone-ein-6yw2yv
          codex/richte-lokale-entwicklerumgebung-auf-iphone-ein-art3ek
          codex/richte-lokale-entwicklerumgebung-auf-iphone-ein-kasduc
          codex/richte-lokale-entwicklerumgebung-auf-iphone-ein-ldgbhw
          codex/richte-lokale-entwicklerumgebung-auf-iphone-ein-op15j7
          codex/richte-lokale-entwicklerumgebung-auf-iphone-ein-rr1agn
          codex/richte-lokale-entwicklerumgebung-auf-iphone-ein-ywuodw
          codex/run-codex-cloud-setup-script
          deploy/generated-heavy-metal-workspace-20260618
          revert-24-codespace-codeagent-mobile-97pvvqgp594527776
          uniqueclaw-production-grade
          uniqueclaw-production-grade-v2
          "

          echo "Modus: ${BESTAETIGUNG}"
          GELOESCHT=0; UEBERSPRUNGEN=0; FEHLT=0

          for BRANCH in $ZU_LOESCHEN; do
            # Der Platzhalter haelt den Dolt-Systembranch aus der Liste heraus,
            # ohne die Zeile zu entfernen — so bleibt im Protokoll sichtbar,
            # dass er geprueft und bewusst behalten wurde.
            case "$BRANCH" in *PLATZHALTER) continue;; esac

            for P in $GESCHUETZT; do
              if [ "$BRANCH" = "$P" ]; then
                echo "GESCHUETZT  $BRANCH"
                UEBERSPRUNGEN=$((UEBERSPRUNGEN+1))
                continue 2
              fi
            done

            SHA=$(git rev-parse --verify --quiet "refs/remotes/origin/$BRANCH" || true)
            if [ -z "$SHA" ]; then
              echo "NICHT DA    $BRANCH"
              FEHLT=$((FEHLT+1))
              continue
            fi

            if [ "$BESTAETIGUNG" = "loeschen" ]; then
              if git push origin --delete "$BRANCH"; then
                echo "GELOESCHT   $BRANCH  (war $SHA)"
                GELOESCHT=$((GELOESCHT+1))
              else
                echo "FEHLER      $BRANCH"
                exit 1
              fi
            else
              echo "PROBELAUF   $BRANCH  (waere $SHA)"
              GELOESCHT=$((GELOESCHT+1))
            fi
          done

          echo
          echo "bearbeitet=$GELOESCHT  geschuetzt=$UEBERSPRUNGEN  nicht_vorhanden=$FEHLT"

      - name: Verbleibende Branches
        run: |
          git fetch --prune origin
          echo "Noch vorhanden:"
          git branch -r | grep -v HEAD | sed 's|  origin/|  |'
