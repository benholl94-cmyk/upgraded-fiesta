name: ci

on:
  push:
    paths-ignore:
      - "logs/**"
      - "docs/master-dossier.html"
  pull_request:
  workflow_dispatch:

jobs:
  rust:
    name: Rust (fmt · clippy · check · test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace -- -D warnings
      - run: cargo check --workspace
      - run: cargo test --workspace

  python:
    name: Python (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: pip install pytest
      - name: Validate repo structure
        run: python3 scripts/validate_repo.py
      - name: Run pytest
        run: python3 -m pytest tests/ -q
      - name: Multi-agent config + adapter wiring
        # Prueft, dass config/agents.json ladbar ist, jeder Adapter gebaut
        # werden kann und der codex-patch Skill-Scope im Oracle-Gate existiert.
        # Ohne diesen Scope lehnt das Gate jeden Codex-Aufruf ab -- die
        # Integration waere dann nur nominell verdrahtet.
        run: python3 -m agents status

      - name: HUGIN index.html sync check
        run: |
          if ! diff -q hugin/hugin.html hugin/index.html > /dev/null 2>&1; then
            echo "ERROR: hugin/index.html is out of sync with hugin/hugin.html"
            echo "Fix: cp hugin/hugin.html hugin/index.html"
            exit 1
          fi
          echo "hugin/index.html in sync ✓"

  ui:
    name: UI (tsc · vite build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install UI dependencies
        run: npm install --no-save
        working-directory: ui
      - name: TypeScript type-check
        run: npx tsc --noEmit
        working-directory: ui
      - name: Vite build
        run: npx vite build
        working-directory: ui

  synergy:
    name: Synergy audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Scan repo index
        run: python3 scripts/repo_tracker.py scan
      - name: Run synergy audit
        run: python3 scripts/repo_tracker.py audit

  munin-checkpoint:
    name: MUNIN Checkpoint
    runs-on: ubuntu-latest
    needs: [rust, python, ui, synergy]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Write MUNIN checkpoint
        run: |
          python3 scripts/munin_bridge.py checkpoint \
            "CI grün auf main: commit ${{ github.sha }} — ${{ github.event.head_commit.message }}"
      - name: Commit state if changed
        run: |
          git config user.email "274793931+benholl94-cmyk@users.noreply.github.com"
          git config user.name "benholl94-cmyk"
          if git diff --quiet .claude/persona/munin-state.json 2>/dev/null; then
            echo "No state change."
          else
            git add -f .claude/persona/munin-state.json
            git commit -m "chore(munin): checkpoint nach CI-Erfolg [skip ci]"
            git push origin HEAD
          fi
