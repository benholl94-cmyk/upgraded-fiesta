name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  rust:
    name: Rust (fmt · clippy · check · test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace -- -D warnings
      - run: cargo check --workspace
      - run: cargo test --workspace

  python:
    name: Python (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: pip install pytest
      - name: Validate repo structure
        run: python3 scripts/validate_repo.py
      - name: Run pytest
        run: python3 -m pytest tests/ -q

  ui:
    name: UI (tsc · vite build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install UI dependencies
        run: npm install --no-save
        working-directory: ui
      - name: TypeScript type-check
        run: npx tsc --noEmit
        working-directory: ui
      - name: Vite build
        run: npx vite build
        working-directory: ui

  synergy:
    name: Synergy audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Scan repo index
        run: python3 scripts/repo_tracker.py scan
      - name: Run synergy audit
        run: python3 scripts/repo_tracker.py audit
