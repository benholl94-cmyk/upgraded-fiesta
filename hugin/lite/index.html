<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#05070a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="HUGIN Lite">
<title>HUGIN · Lite</title>
<style>
  :root{
    --bg:#05070a; --bg2:#0b0f16; --line:rgba(62,244,230,.12);
    --cyan:#3ef4e6; --amber:#ffb84d; --green:#39ff9d; --red:#ff4f6d;
    --text:#dfe8ee; --dim:#6b7a8c;
    --mono:'Menlo','SF Mono','Cascadia Code','Consolas',monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;background:var(--bg);color:var(--text);font-family:var(--mono);}
  body{display:flex;flex-direction:column;overflow:hidden;}

  header{
    display:flex;align-items:center;gap:10px;
    padding:calc(12px + env(safe-area-inset-top)) 14px 10px;
    border-bottom:1px solid var(--line);
    background:rgba(5,7,10,.9);
    backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
    flex:none;
  }
  .raven svg{width:26px;height:26px;}
  h1{font-size:14px;font-weight:400;letter-spacing:.14em;color:var(--cyan);}
  .hbadge{
    font-size:8px;letter-spacing:.14em;color:#6b7a8c;
    background:rgba(107,122,140,.1);border:1px solid rgba(107,122,140,.25);
    border-radius:3px;padding:1px 6px;
  }
  .hlimit{
    margin-left:auto;font-size:9px;color:var(--dim);font-family:var(--mono);
  }
  #limitcount{color:var(--amber);}

  main{flex:1;overflow-y:auto;padding:12px;}

  .msg{
    max-width:88%;margin-bottom:10px;padding:10px 13px;border-radius:10px;
    font-size:13px;line-height:1.6;word-break:break-word;
  }
  .user{
    margin-left:auto;background:rgba(62,244,230,.1);
    border:1px solid rgba(62,244,230,.2);color:var(--text);
    border-bottom-right-radius:3px;
  }
  .bot{
    background:rgba(11,15,22,.8);border:1px solid var(--line);
    color:var(--text);border-bottom-left-radius:3px;
  }
  .sys{
    text-align:center;font-size:10px;color:var(--dim);margin:6px auto;
    max-width:100%;background:none;border:none;padding:4px;
  }
  .badge{
    display:flex;align-items:center;gap:6px;margin-bottom:5px;
    font-size:10px;color:var(--dim);
  }
  .dot{width:6px;height:6px;border-radius:50%;flex:none;}
  .dot.cloud{background:var(--cyan);box-shadow:0 0 8px var(--cyan);}
  .dot.err{background:var(--red);}
  .cursor{display:inline-block;width:2px;height:13px;background:var(--cyan);
    margin-left:2px;animation:blink .8s step-end infinite;vertical-align:middle;}
  @keyframes blink{50%{opacity:0;}}

  /* Upgrade CTA */
  .cta-card{
    background:rgba(255,184,77,.06);border:1px solid rgba(255,184,77,.25);
    border-radius:10px;padding:14px 16px;margin:16px 0 10px;font-size:12px;
    color:var(--text);line-height:1.65;
  }
  .cta-card .cta-title{
    font-size:10px;letter-spacing:.14em;color:var(--amber);margin-bottom:8px;
  }
  .cta-card .cta-list{color:var(--dim);font-size:11px;padding-left:14px;margin:6px 0;}
  .cta-card .cta-list li{margin-bottom:3px;}
  .cta-btn{
    display:inline-block;margin-top:10px;padding:9px 18px;
    background:linear-gradient(135deg,var(--amber),#ff9500);
    color:#05070a;border:none;border-radius:8px;font-size:12px;
    font-family:var(--mono);cursor:pointer;font-weight:700;
    letter-spacing:.04em;text-decoration:none;
    -webkit-appearance:none;
  }

  footer{
    border-top:1px solid var(--line);background:rgba(5,7,10,.9);
    padding:10px 12px calc(10px + env(safe-area-inset-bottom));
    flex:none;
  }
  .inputrow{display:flex;gap:8px;align-items:flex-end;}
  textarea{
    flex:1;background:rgba(11,15,22,.7);border:1px solid var(--line);
    color:var(--text);border-radius:10px;padding:10px 12px;
    font-size:13px;font-family:var(--mono);resize:none;
    -webkit-appearance:none;min-height:42px;max-height:100px;
    line-height:1.5;
  }
  textarea:focus{outline:none;border-color:rgba(62,244,230,.4);}
  .sendbtn{
    width:42px;height:42px;border-radius:11px;border:none;flex:none;
    background:linear-gradient(135deg,var(--cyan),#00c8b8);color:#05070a;
    font-size:16px;font-weight:800;cursor:pointer;-webkit-appearance:none;
  }
  .sendbtn:disabled{opacity:.35;cursor:not-allowed;}

  .statusline{
    font-family:var(--mono);font-size:9px;color:var(--dim);
    margin-top:5px;min-height:14px;
  }

  /* limit reached overlay */
  .limit-overlay{
    display:none;position:fixed;inset:0;background:rgba(5,7,10,.92);
    z-index:100;align-items:center;justify-content:center;padding:24px;
  }
  .limit-overlay.show{display:flex;}
  .limit-box{
    background:rgba(11,15,22,.95);border:1px solid rgba(255,184,77,.35);
    border-radius:14px;padding:28px 24px;max-width:340px;text-align:center;
  }
  .limit-box h2{font-size:15px;color:var(--amber);margin-bottom:10px;font-weight:400;letter-spacing:.1em;}
  .limit-box p{font-size:12px;color:var(--dim);line-height:1.7;margin-bottom:16px;}
</style>
</head>
<body>

<header>
  <div class="raven">
    <svg viewBox="0 0 64 64"><path fill="none" stroke="#3ef4e6" stroke-width="2.4" d="M8 40 Q16 18 32 16 Q48 18 56 40 Q44 34 40 42 Q36 30 32 30 Q28 30 24 42 Q20 34 8 40 Z"/><circle cx="26" cy="26" r="1.6" fill="#3ef4e6"/></svg>
  </div>
  <div>
    <h1>HUGIN</h1>
  </div>
  <span class="hbadge">LITE</span>
  <div class="hlimit">Nachrichten: <span id="limitcount">10</span> verbleibend</div>
</header>

<main id="feed" role="log" aria-live="polite"></main>

<div class="limit-overlay" id="limitOverlay">
  <div class="limit-box">
    <h2>TESTLIMIT ERREICHT</h2>
    <p>Die Lite-Version umfasst 10 Nachrichten zur Evaluation.<br>
    Für vollständigen Zugang kontaktiere den Owner.</p>
    <a class="cta-btn" href="mailto:benjaminhollbach25@gmail.com?subject=HUGIN%20Upgrade%20Anfrage">Upgrade anfragen ›</a>
  </div>
</div>

<footer>
  <div class="inputrow">
    <textarea id="input" rows="1" placeholder="Frag HUGIN…" aria-label="Nachricht"></textarea>
    <button class="sendbtn" id="btnSend" aria-label="Senden">➤</button>
  </div>
  <div class="statusline" id="statusline">bereit · Lite-Version</div>
</footer>

<script>
/* ── HUGIN LITE — Einzel-Provider (Pollinations), 10 Nachrichten ── */

const LIMIT = 10;
let msgCount = parseInt(localStorage.getItem('hugin_lite_count') || '0');
let history = [{role:'system', content:'Du bist Hugin, ein knapper präziser Assistent. Antworte direkt.'}];

const feed = document.getElementById('feed');
const input = document.getElementById('input');
const statusline = document.getElementById('statusline');
const btnSend = document.getElementById('btnSend');
const limitCount = document.getElementById('limitcount');
const limitOverlay = document.getElementById('limitOverlay');

function updateLimitDisplay(){
  const rem = Math.max(0, LIMIT - msgCount);
  limitCount.textContent = rem;
  if(rem === 0){ btnSend.disabled = true; input.disabled = true; }
}

function addMsg(role, text){
  const d = document.createElement('div');
  d.className = 'msg ' + role;
  d.textContent = text;
  feed.appendChild(d);
  feed.scrollTop = feed.scrollHeight;
  return d;
}

function addBotShell(){
  const d = document.createElement('div');
  d.className = 'msg bot';
  d.innerHTML = '<div class="badge"><span class="dot cloud" data-r="dot"></span><span data-r="lbl">verbinde…</span></div><span data-r="txt"></span><span class="cursor" data-r="cur"></span>';
  feed.appendChild(d);
  feed.scrollTop = feed.scrollHeight;
  return d;
}

/* CTA nach 5 Nachrichten einblenden */
function maybeShowCTA(){
  if(msgCount === 5){
    const c = document.createElement('div');
    c.className = 'msg cta-card';
    c.innerHTML = `
      <div class="cta-title">HUGIN ADMIN — VOLLVERSION</div>
      Alle Provider · TERMSHELL · Parallelmodus · unbegrenzte Nachrichten ·
      EMA-Router · ReflexKernel offline · Response-Validierungs-Gate
      <ul class="cta-list">
        <li>7 verifizierte AI-Provider (keyless)</li>
        <li>SHELL-Tab mit race/run/best Parallelbefehlen</li>
        <li>Permanenter Exec-Log — volle Transparenz</li>
        <li>Unbegrenzte Session-Länge</li>
      </ul>
      <a class="cta-btn" href="mailto:benjaminhollbach25@gmail.com?subject=HUGIN%20Upgrade">Upgrade anfragen ›</a>`;
    feed.appendChild(c);
    feed.scrollTop = feed.scrollHeight;
  }
}

async function callPollinations(messages, onToken){
  const resp = await fetch('https://text.pollinations.ai/openai', {
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify({
      model:'openai-large',
      messages,
      stream: true,
      seed: Math.floor(Math.random()*999999)
    })
  });
  if(!resp.ok) throw new Error('HTTP ' + resp.status);
  const reader = resp.body.getReader();
  const dec = new TextDecoder();
  let full = '';
  while(true){
    const {done, value} = await reader.read();
    if(done) break;
    const chunk = dec.decode(value, {stream:true});
    for(const line of chunk.split('\n')){
      if(!line.startsWith('data:')) continue;
      const d = line.slice(5).trim();
      if(d === '[DONE]') break;
      try{
        const tok = JSON.parse(d)?.choices?.[0]?.delta?.content;
        if(tok){ full += tok; onToken(tok); }
      }catch(_){}
    }
  }
  return full;
}

async function send(){
  const text = input.value.trim();
  if(!text) return;
  if(msgCount >= LIMIT){ limitOverlay.classList.add('show'); return; }

  input.value = ''; input.style.height = 'auto';
  msgCount++;
  localStorage.setItem('hugin_lite_count', msgCount);
  updateLimitDisplay();
  maybeShowCTA();

  addMsg('user', text);
  history.push({role:'user', content:text});

  const shell = addBotShell();
  const dot = shell.querySelector('[data-r=dot]');
  const lbl = shell.querySelector('[data-r=lbl]');
  const txt = shell.querySelector('[data-r=txt]');
  const cur = shell.querySelector('[data-r=cur]');

  statusline.textContent = 'Pollinations · verbindet…';
  btnSend.disabled = true;

  let acc = '';
  try{
    const t0 = Date.now();
    await callPollinations(history, tok => {
      acc += tok; txt.textContent = acc;
      feed.scrollTop = feed.scrollHeight;
    });
    const ms = Date.now() - t0;
    lbl.textContent = 'Pollinations · ' + ms + 'ms';
    dot.className = 'dot cloud';
    history.push({role:'assistant', content:acc});
    statusline.textContent = 'bereit · Lite-Version · ' + Math.max(0,LIMIT-msgCount) + ' verbleibend';
  }catch(e){
    dot.className = 'dot err';
    lbl.textContent = 'Verbindungsfehler';
    txt.textContent = 'Fehler: ' + e.message + '. Bitte erneut versuchen.';
    statusline.textContent = 'Fehler — bitte erneut versuchen';
    msgCount--;
    localStorage.setItem('hugin_lite_count', msgCount);
    updateLimitDisplay();
  }finally{
    cur.remove();
    if(msgCount < LIMIT) btnSend.disabled = false;
  }
}

btnSend.addEventListener('click', send);
input.addEventListener('keydown', e => {
  if(e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); send(); }
});
input.addEventListener('input', () => {
  input.style.height = 'auto';
  input.style.height = Math.min(100, input.scrollHeight) + 'px';
});

/* Init */
updateLimitDisplay();
if(msgCount >= LIMIT){
  addMsg('sys', 'Testlimit von 10 Nachrichten erreicht. Upgrade anfragen für Vollzugang.');
  limitOverlay.classList.add('show');
} else {
  addMsg('sys', 'HUGIN Lite · ' + (LIMIT - msgCount) + ' Testnachrichten verfügbar. Upgrade für Vollversion.');
}
</script>
</body>
</html>
