# Fullstack-Compose: Datenschicht, zwei Gateways, Lastverteiler, UI.
#
# ACHTUNG, RELATIVE PFADE. Diese Datei liegt in `deploy/`, und docker compose
# loest `./` gegen das Verzeichnis der Compose-Datei auf -- nicht gegen die
# Repo-Wurzel. Drei Pfade zeigten deshalb ins Leere und wurden beim ersten
# echten Lauf am 2026-08-02 gefunden:
#
#   ./scripts/init-db.sql   -> deploy/scripts/init-db.sql  (existiert nicht)
#   ./config/nginx-lb.conf  -> deploy/config/nginx-lb.conf (existiert nicht)
#   context: .              -> deploy/                     (kein Dockerfile)
#
# Der erste war der luetteste: Docker legt fuer einen fehlenden Bind-Mount ein
# VERZEICHNIS an, statt zu scheitern. Postgres startete, legte die Datenbank
# an und starb dann an `psql: could not read from input file: Is a directory`
# -- eine Fehlermeldung ueber ein Verzeichnis, das es vorher nicht gab.
#
# `docker compose config` konnte das nicht finden: es prueft Syntax, nicht ob
# ein Bind-Mount-Ziel existiert. Deshalb stand diese Datei monatelang als
# "gueltig" im Build-Manifest und war trotzdem nicht startbar.

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-heavy}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-heavy_metal}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    ports:
      - "${POSTGRES_BIND:-127.0.0.1}:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    ports:
      - "${REDIS_BIND:-127.0.0.1}:${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  gateway:
    build:
      context: ..
      dockerfile: Dockerfile
    environment:
      HM_OWNER_TOKEN: "${HM_OWNER_TOKEN:?HM_OWNER_TOKEN is required}"
      HM_GATEWAY_BIND: "0.0.0.0:8080"
      HM_STORAGE_BACKEND: "${HM_STORAGE_BACKEND:-local}"
      HM_STORAGE_ROOT: /data/storage
      HM_CRON_CONFIG: /app/config/cron.json
      HM_LLM_ENABLE: "${HM_LLM_ENABLE:-false}"
      HM_LLM_API_URL: "${HM_LLM_API_URL:-}"
      HM_LLM_API_KEY: "${HM_LLM_API_KEY:-}"
      HM_LLM_MODEL: "${HM_LLM_MODEL:-}"
    volumes:
      - gwdata:/data/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "${GATEWAY_BIND:-0.0.0.0}:${GATEWAY_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s
    restart: unless-stopped

  gateway-b:
    build:
      context: ..
      dockerfile: Dockerfile
    environment:
      HM_OWNER_TOKEN: "${HM_OWNER_TOKEN:?HM_OWNER_TOKEN is required}"
      HM_GATEWAY_BIND: "0.0.0.0:8080"
      HM_STORAGE_BACKEND: "${HM_STORAGE_BACKEND:-local}"
      HM_STORAGE_ROOT: /data/storage
      HM_LLM_ENABLE: "${HM_LLM_ENABLE:-false}"
      HM_LLM_API_URL: "${HM_LLM_API_URL:-}"
      HM_LLM_API_KEY: "${HM_LLM_API_KEY:-}"
      HM_LLM_MODEL: "${HM_LLM_MODEL:-}"
    volumes:
      - gwdata:/data/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s
    restart: unless-stopped

  nginx-lb:
    image: nginx:1.27-alpine
    volumes:
      - ../config/nginx-lb.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      gateway:
        condition: service_healthy
      gateway-b:
        condition: service_healthy
    ports:
      - "${LB_BIND:-0.0.0.0}:${LB_PORT:-8000}:80"
    restart: unless-stopped

  ui:
    build:
      context: ..
      dockerfile: Dockerfile.ui
    depends_on:
      nginx-lb:
        condition: service_started
    ports:
      - "${UI_BIND:-0.0.0.0}:${UI_PORT:-3000}:80"
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  gwdata:
